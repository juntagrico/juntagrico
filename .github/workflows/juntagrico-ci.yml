name: juntagrico-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'releases/**' ]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --preview

  check-dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deptry
        run: |
          pip install --upgrade -r requirements.txt
          pip install deptry

      - name: Run deptry
        run: deptry . --extend-exclude ".*/debug.py" --github-output

  tests-postgres:
    name: Tests (${{ matrix.python-version }}, postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: .
      EXCLUDE_TEST: ${{ matrix.exclude-test }}
      COVERAGE_FILE: coverage${{ matrix.exclude-test }}
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        exclude-test: ['']
        include:
          - python-version: '3.11'
            exclude-test: shares

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: install dependencies
      run: |
        pip install --upgrade -r requirements.txt
        pip install psycopg
    - name: make migrations
      run: python -m django makemigrations --noinput
    - name: run tests
      run: |
        echo "::remove-matcher owner=python::"
        python -m manage test juntagrico.tests --parallel --exclude-tag=$EXCLUDE_TEST
        python -m manage test juntagrico_legacy.tests --parallel --settings="settings.legacy"
        python -m manage test juntagrico.tests.test_deploy --parallel --settings="settings.deployment"
      if: ${{ matrix.python-version  != '3.11' }}
    - name: run tests with coverage
      run: |
        echo "::remove-matcher owner=python::"
        coverage run --parallel-mode --concurrency=multiprocessing -m manage test juntagrico.tests --parallel --exclude-tag=$EXCLUDE_TEST
        coverage run --parallel-mode --concurrency=multiprocessing -m manage test juntagrico_legacy.tests --parallel --settings="settings.legacy"
        coverage run --parallel-mode --concurrency=multiprocessing -m manage test juntagrico.tests.test_deploy --parallel --settings="settings.deployment"
        coverage combine
        coverage lcov -o coverage-${{ matrix.exclude-test }}.lcov
      if: ${{ matrix.python-version  == '3.11' }}
    - uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version  == '3.11' }}
      with:
        name: coverage-${{ matrix.exclude-test }}
        path: coverage-${{ matrix.exclude-test }}.lcov

  tests-mysql:
    name: Tests (3.14, mysql)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: .
      GITHUB_MYSQL: 1

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install dependencies
      run: |
        pip install --upgrade -r requirements.txt
        pip install mysqlclient
    - name: make migrations
      run: python -m django makemigrations --noinput
    - name: run tests
      run: |
        echo "::remove-matcher owner=python::"
        python -m manage test juntagrico.tests --parallel
        python -m manage test juntagrico_legacy.tests --parallel --settings="settings.legacy"

  coverage:
    name: Coverage Report
    needs: tests-postgres
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: coverage
          merge-multiple: true
      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage*.lcov
